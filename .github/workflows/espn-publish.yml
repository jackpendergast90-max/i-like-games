
name: Publish verified ESPN website update

on:
  workflow_dispatch:
  schedule:
    # Tuesdays at 16:00 UTC (noon EDT / 11 AM EST)
    - cron: '0 16 * * 2'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ilg-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.12.3

      - name: Fetch and validate ESPN snapshot
        run: python scripts/check_espn.py

      - name: Build website safely
        run: >-
          python scripts/build_site.py
          --snapshot espn-preview.json
          --template site-template.html
          --output index.html
          --ledger chug_status.json
          --player-points player_points_2026.json

      - name: Check essential site sections
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          s = BeautifulSoup(Path('index.html').read_text(encoding='utf-8'), 'html.parser')
          for name in ('weekly','standings','power','seasons','drafts','profiles','gallery','office','chug-tracker'):
              assert s.find(id=name), f'Missing site section: {name}'
          assert len(s.select('#standings tbody tr')) == 10, 'Standings must have ten teams'
          assert len(s.select('#weekly .matchup-meta')) == 5, 'Five matchups required'
          assert len(s.find_all('img')) >= 50, 'Photo gallery unexpectedly reduced'
          assert '2026 Chug Ledger' in s.get_text(), 'Chug ledger missing'
          print('Page structure, Chug Watch and photo checks passed')
          PY

      - name: Commit only the generated website
        run: |
          if git diff --quiet -- index.html; then
            echo 'No content changes; still deploying the current website.'
          else
            git config user.name 'I LIKE GAMES updater'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Update I LIKE GAMES from validated ESPN results'
            git push
          fi

      - name: Prepare public website only
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
