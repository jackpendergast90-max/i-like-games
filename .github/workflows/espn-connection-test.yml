name: Test ESPN public league access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public ESPN endpoints (no credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          league = '1631713270'
          base = f'https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026/segments/0/leagues/{league}'
          for view in ('mTeam', 'mMatchup'):
              url = base + '?view=' + view
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      data = json.load(res)
                      print(f'{view}: HTTP {res.status}; league={data.get("id")}; teams={len(data.get("teams", []))}; matchups={len(data.get("schedule", []))}; current_week={data.get("scoringPeriodId")}')
                      if str(data.get('id')) != league:
                          raise ValueError('Unexpected league ID')
              except urllib.error.HTTPError as exc:
                  print(f'{view}: HTTP {exc.code} (403/401 generally means public API access is restricted)')
                  raise
          PY
