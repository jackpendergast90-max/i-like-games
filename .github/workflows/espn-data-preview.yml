name: Preview ESPN weekly data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-espn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate ESPN data
        run: python scripts/check_espn.py
      - name: Save snapshot for inspection
        uses: actions/upload-artifact@v4
        with:
          name: espn-preview
          path: espn-preview.json
          retention-days: 7
